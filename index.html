<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ירח הדבש - יפן ותאילנד 🌸</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Melatef';
            src: url('https://fonts.gstatic.com/s/heebo/v22/NGSpv5xP0k9W9h6PzKSmpnS1zbk.woff2') format('woff2');
            font-weight: 700;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Heebo', sans-serif;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            object-fit: cover;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #FFFFFF;
            padding: 20px;
        }

        h1 {
            font-family: 'Melatef', 'Heebo', sans-serif;
            font-size: 3.8rem;
            margin: 0 0 15px 0;
            color: #FFB7C5;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
        }

        p {
            font-size: 1.3rem;
            margin: 0 0 35px 0;
            opacity: 0.95;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .buttons-wrapper {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-destination {
            display: inline-block;
            background: linear-gradient(135deg, #FF5E7E, #FF8E9E);
            color: white;
            padding: 16px 36px;
            font-size: 1.25rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(255, 94, 126, 0.4);
            transition: all 0.3s ease;
        }

        .btn-destination.thailand {
            background: linear-gradient(135deg, #00B4D8, #90E0EF);
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.4);
        }

        .btn-destination:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 94, 126, 0.6);
        }

        .btn-destination.thailand:hover {
            box-shadow: 0 8px 25px rgba(0, 180, 216, 0.6);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.6rem; }
            p { font-size: 1.1rem; }
            .btn-destination { padding: 14px 28px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <video autoplay muted loop class="video-background">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-cherry-blossom-tree-branch-in-spring-41132-large.mp4" type="video/mp4">
        הדפדפן שלך אינו תומך בוידאו.
    </video>

    <div class="video-overlay"></div>

    <div class="container">
        <h1>ירח הדבש הקסום 🌸</h1>
        <p>מסע חלומי בין יפן המופלאה לתאילנד הטרופית</p>
        
        <div class="buttons-wrapper">
            <a href="japan.html" class="btn-destination">🇯🇵 מעבר ליפן</a>
            <a href="thailand.html" class="btn-destination thailand">🌴 תאילנד הקסומה</a>
        </div>
    </div>

</body>
</html>
