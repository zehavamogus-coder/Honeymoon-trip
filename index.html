<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ירח הדבש שלנו: יפן ותאילנד 🌸🌴</title>
    <style>
        :root {
            --bg-color: #FAFAFA;
            --primary-rose: #FF6584;
            --turquoise: #00CEC9;
            --text-dark: #2C3E50;
            --white: #FFFFFF;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero {
            padding: 50px 20px;
            max-width: 700px;
        }

        h1 {
            font-size: 3rem;
            color: var(--primary-rose);
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 40px;
        }

        .nav-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-rose), var(--turquoise));
            color: var(--white);
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .btn span {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>🌸 ירח הדבש שלנו 🌴</h1>
        <p>6 שבועות של חלום: 29.9.2026 – 9.11.2026</p>
        
        <div class="nav-buttons">
            <a href="japan.html" class="btn">
                🇯🇵 יפן הקסומה
                <span>29.9 - 20.10 (3 שבועות)</span>
            </a>
            <a href="thailand.html" class="btn">
                🇹🇭 תאילנד הטרופית
                <span>21.10 - 9.11 (3 שבועות)</span>
            </a>
        </div>
    </div>

</body>
</html>
